<button id="replay" aria-label="Replay">&#8635;</button>
<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$('#stage');
function fit(){const w=innerWidth,h=innerHeight,s=Math.min(w/870,(h-64)/880);stage.style.transform='translate('+(w/2-542*s)+'px,'+((h-40)/2-666*s)+'px) scale('+s+')'}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
const closed=$('#scene').style.transform;let opened=false,tok=0;
const F={duration:1100,fill:'forwards',easing:'cubic-bezier(.2,.7,.2,1)'};
async function open(){
 if(opened)return;opened=true;const my=++tok;
 const seal=$('#seal');seal.classList.add('gone');
 seal.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.14) translateY(-8px)',opacity:1,offset:.35},{transform:'scale(.85) translateY(10px)',opacity:0}],{duration:650,fill:'forwards',easing:'ease-out'});
 await wait(500);if(my!==tok)return;
 $('#scene').animate([{transform:closed},{transform:'translate(0px,0px) scale(1)'}],{duration:2200,fill:'forwards',easing:'cubic-bezier(.5,0,.2,1)'});
 $('#fsh').animate([{opacity:1},{opacity:0}],{duration:800,delay:150,fill:'forwards'});
 $('#flap').animate([{transform:'rotateX(180deg)'},{transform:'rotateX(0deg)'}],{duration:1400,fill:'forwards',easing:'cubic-bezier(.45,0,.25,1)'});
 setTimeout(()=>{if(my===tok){$('#flapw').style.zIndex=2;$('#rise').style.visibility='visible'}},700);
 $('#t1').animate([{opacity:1},{opacity:0}],{duration:700,fill:'forwards'});$('#t2').animate([{opacity:1},{opacity:0}],{duration:500,fill:'forwards'});
 ['#i1','#i2','#i3'].forEach((s,i)=>$(s).animate([{transform:'translateY(470px)'},{transform:'translateY(0)'}],{...F,duration:1300,delay:1000+i*170}));
 await wait(2900);if(my!==tok)return;
 $('#d1').animate([{opacity:0,transform:'scale(1.5) rotate(-6deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],{duration:450,fill:'forwards',easing:'cubic-bezier(.3,1.4,.5,1)'});
 $('#d2').animate([{opacity:0,transform:'scale(1.25)'},{opacity:1,transform:'scale(1)'}],{duration:500,delay:280,fill:'forwards',easing:'ease-out'});
 $('#d3').animate([{opacity:0,transform:'translate(40px,-30px) rotate(-35deg) scale(.6)'},{opacity:1,transform:'none'}],{duration:1100,delay:450,fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'});
 await wait(2000);if(my===tok)$('#replay').classList.add('on');
}
function reset(){tok++;opened=false;document.getAnimations().forEach(a=>a.cancel());$('#flapw').style.zIndex='';$('#rise').style.visibility='';$('#seal').classList.remove('gone');$('#replay').classList.remove('on')}
$('#seal').addEventListener('click',open);
$('#replay').addEventListener('click',reset);
</script></body></html>
